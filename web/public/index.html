<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Server</title>
    <link rel="stylesheet" href="./static/styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection" class="section login-section">
        <div class="login-container">
            <h2 class="login-title">Welcome Back</h2>
            <div class="form-group">
                <input type="email" id="txtEmail" class="form-input" placeholder="email@domain.com" />
            </div>
            <div class="form-group">
                <input type="text" id="txtUsername" class="form-input" placeholder="Username" />
            </div>
            <button id="btnSignin" class="btn-primary">Sign In</button>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="homeSection" class="section dashboard-section">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">Web Game Server</div>
            <div class="navbar-right">
                <div class="user-info">
                    <span id="lblHomeUsername">Username</span>
                    <span>|</span>
                    <span id="lblHomePoints">0 Points</span>
                </div>
                <button id="btnHamburger" class="hamburger-menu" title="Menu">☰</button>
            </div>
        </nav>

        <!-- Right Side Panel -->
        <div id="rightPanel" class="right-panel">
            <div class="panel-header">
                <span style="font-size: 1.5rem; margin-right: 1rem;">⚙️</span>
                Menu
            </div>
            <div class="panel-content">
                <h4 style="margin-bottom: 0.5rem; color: #333;">Account Settings</h4>
                <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">Manage your account settings and preferences.</p>
            </div>
            <div class="panel-footer">
                <button id="btnLogout" class="logout-btn">Log Out</button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <!-- Match Search Section -->
            <div class="match-section">
                <h3>🎮 Server Match</h3>
                <p style="margin-bottom: 1rem; color: #666;">Search for a new game match</p>
                <button id="btnHomeMatch" class="btn-search">Search for Match</button>
            </div>

            <!-- Games List Table -->
            <h3 style="margin: 1.5rem 0 1rem; color: #333;">📊 Game History</h3>
            <table class="game-table">
                <thead>
                    <tr>
                        <th>Game</th>
                        <th>Points</th>
                        <th>Last Played</th>
                    </tr>
                </thead>
                <tbody id="dashboardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Game Section -->
    <div id="gameSection" class="section game-section">
        <div class="game-container">
            <h2 style="color: #333; margin-bottom: 1rem;">🎮 Game in Progress</h2>
            <p style="color: #666;">Game is currently running...</p>
        </div>
    </div>

    <!-- Main JavaScript -->
    <script src="./static/main.js"></script>
</body>
</html>
